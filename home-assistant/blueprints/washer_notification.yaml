blueprint:
  name: Samsung washer — ongoing Android notification
  description: >-
    Shows Active/Paused state and Completion time in one ongoing Android Companion
    notification. Finished replaces the ongoing card with a dismissible Wash finished
    notification. Power off, or an unavailable Power entity, clears it. Delay start
    shows a scheduled-finish label rather than a progress bar.
  domain: automation
  input:
    machine_state:
      name: Machine state
      description: Active, Paused, or Idle. Unavailable when the panel state is not known.
      selector:
        entity:
          domain: sensor
    progress:
      name: Progress
      description: Finished, Delayed start, or Idle.
      selector:
        entity:
          domain: sensor
    completion_time:
      name: Completion time
      description: Remaining time in minutes, or the delay duration while Delay End is showing.
      selector:
        entity:
          domain: sensor
    delay_start:
      name: Delay start
      description: Delay End duration in hours. Zero while the panel shows a countdown.
      selector:
        entity:
          domain: number
    power:
      name: Power
      selector:
        entity:
          domain: binary_sensor
    cycle_duration:
      name: Cycle duration helper
      description: Dedicated Number helper, minimum 0, maximum 172800, step 1, unit s. Retains the estimated cycle duration across pauses and HA restarts.
      selector:
        entity:
          domain: input_number
    navigation_path:
      name: Washer page
      description: Home Assistant path opened when tapping the notification.
      default: /lovelace/0
      selector:
        text:
    notify_action:
      name: Android phone notification action
      description: "Enter your phone's action, e.g. notify.mobile_app_pixel_9 (not a notify group)."
      selector:
        text:

mode: restart

variables:
  machine_entity: !input machine_state
  progress_entity: !input progress
  completion_entity: !input completion_time
  delay_entity: !input delay_start
  power_entity: !input power
  duration_entity: !input cycle_duration
  notification_tag: "washer_{{ machine_entity | replace('.', '_') }}"
  remaining_minutes: "{{ states(completion_entity) | float(-1) }}"
  delay_hours: "{{ states(delay_entity) | float(0) }}"
  remaining_seconds: >-
    {% set minutes = remaining_minutes | float(-1) %}
    {{ (minutes * 60) | int if minutes >= 0 else -1 }}
  cycle_seconds: >-
    {{ [states(duration_entity) | int(0),
        (remaining_seconds | int) if is_state(machine_entity, 'Active') else 0] | max }}

triggers:
  - trigger: state
    entity_id: !input machine_state
  - trigger: state
    entity_id: !input progress
  - trigger: state
    entity_id: !input completion_time
  - trigger: state
    entity_id: !input delay_start
  - trigger: state
    entity_id: !input power
  - trigger: homeassistant
    event: start

actions:
  - if:
      - condition: template
        value_template: >-
          {{ is_state(machine_entity, 'Active') and
             (remaining_seconds | int) > (states(duration_entity) | int(0)) }}
    then:
      - action: input_number.set_value
        target:
          entity_id: !input cycle_duration
        data:
          value: "{{ cycle_seconds }}"
  - choose:
      - conditions: "{{ not is_state(power_entity, 'on') }}"
        sequence:
          - action: input_number.set_value
            target:
              entity_id: !input cycle_duration
            data:
              value: 0
          - action: !input notify_action
            data:
              message: clear_notification
              data:
                tag: "{{ notification_tag }}"
      - conditions: >-
          {{ is_state(progress_entity, 'Finished') }}
        sequence:
          - action: input_number.set_value
            target:
              entity_id: !input cycle_duration
            data:
              value: 0
          - action: !input notify_action
            data:
              title: Samsung washer
              message: Wash finished
              data:
                tag: "{{ notification_tag }}"
                clickAction: !input navigation_path
                group: appliances
                channel: Washer status
                importance: low
                persistent: false
                sticky: false
                alert_once: true
                notification_icon: mdi:check-circle-outline
                chronometer: false
                when: 0
                progress: -1
      - conditions: >-
          {{ is_state(progress_entity, 'Delayed start') }}
        sequence:
          - action: !input notify_action
            data:
              title: Samsung washer
              message: "Scheduled finish · {{ delay_hours | int }}h on panel"
              data:
                tag: "{{ notification_tag }}"
                clickAction: !input navigation_path
                group: appliances
                progress: -1
                progress_max: 1
                channel: Washer status
                importance: low
                persistent: true
                sticky: true
                alert_once: true
                notification_icon: mdi:timer-outline
                chronometer: false
                when: 0
      - conditions: >-
          {{ states(machine_entity) in ['Active', 'Paused'] and (remaining_seconds | int) >= 0 }}
        sequence:
          - action: !input notify_action
            data:
              title: Samsung washer
              message: >-
                {% set total = remaining_minutes | int %}
                {% set shown = '%d:%02d' | format(total // 60, total % 60) %}
                {{ 'Washing · estimated time' if is_state(machine_entity, 'Active') else 'Paused' }} · {{ shown }} on panel
              data:
                tag: "{{ notification_tag }}"
                clickAction: !input navigation_path
                group: appliances
                progress: >-
                  {% if (remaining_seconds | int) >= 0 and (cycle_seconds | int) > 0 %}
                    {{ [0, (cycle_seconds | int) - (remaining_seconds | int)] | max }}
                  {% else %}
                    -1
                  {% endif %}
                progress_max: "{{ [cycle_seconds | int, 1] | max }}"
                channel: Washer status
                importance: low
                persistent: true
                sticky: true
                alert_once: true
                notification_icon: >-
                  {{ 'mdi:washing-machine' if is_state(machine_entity, 'Active') else 'mdi:pause-circle-outline' }}
                chronometer: >-
                  {{ is_state(machine_entity, 'Active') and (remaining_seconds | int) > 0 }}
                when: >-
                  {% if is_state(machine_entity, 'Active') and (remaining_seconds | int) > 0 %}
                    {% set anchor = [as_timestamp(states[completion_entity].last_changed),
                                     as_timestamp(states[machine_entity].last_changed)] | max %}
                    {{ (anchor + (remaining_seconds | int)) | int }}
                  {% else %}
                    0
                  {% endif %}
    default:
      - action: !input notify_action
        data:
          message: clear_notification
          data:
            tag: "{{ notification_tag }}"
