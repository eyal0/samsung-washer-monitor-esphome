substitutions:
  cn803_pin2_rx_pin: GPIO2
  cn803_pin1_rx_pin: GPIO1

esphome:
  name: samsung-washer
  friendly_name: Samsung washer

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Network: Wi-Fi. For Thread, use washer-thread.yaml instead.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: homeassistant
    id: homeassistant_time

external_components:
  - source: github://kralonur/samsung-washer-monitor-esphome@main
    components: [samsung_washer]

uart:
  - id: cn803_pin2_uart
    rx_pin: ${cn803_pin2_rx_pin}
    baud_rate: 9600
  - id: cn803_pin1_uart
    rx_pin: ${cn803_pin1_rx_pin}
    baud_rate: 9600

samsung_washer:
  uart_id: cn803_pin1_uart
  secondary_uart_id: cn803_pin2_uart
  time_id: homeassistant_time
  cycle:
    name: Cycle
  wash_temperature:
    name: Wash temperature
  spin_speed:
    name: Spin speed
  rinse_cycles:
    name: Rinse cycles
  bubble_soak:
    name: Bubble soak
  pre_wash:
    name: Pre-wash
  intensive:
    name: Intensive
  extra_rinse:
    name: Extra rinse
  easy_iron_indicator:
    name: Easy Iron indicator
  machine_state:
    name: Machine state
  progress:
    name: Progress
  running:
    name: Running
  completion_time:
    name: Completion time
  delay_start:
    name: Delay start
  estimated_finish:
    name: Estimated finish
  power:
    name: Power
  door_lock_indicator:
    name: Door lock indicator
  uart_link_active:
    name: UART link active
  uart_raw_capture:
    name: UART raw capture
