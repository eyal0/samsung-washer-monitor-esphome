name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install esphome
      - name: Config tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Parser test
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic -Werror firmware/test_parser.cpp -o /tmp/washer-parser-test
          /tmp/washer-parser-test /dev/null 32 0
      - name: Runtime tests
        run: |
          esphome compile tests/component.yaml
          tests/.esphome/build/washer-component-test/.pioenvs/washer-component-test/program
